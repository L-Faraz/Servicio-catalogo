spring:
  datasource:
    url: jdbc:h2:mem:catalogo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

catedra:
  integration:
    api-base-url: http://localhost:9999
    jwt-token: test-token
    group-id: test-group
    redis-host: localhost
    redis-port: 6379
    kafka-enabled: false
    reconciliation-enabled: false
