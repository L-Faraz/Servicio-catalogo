name: servicio-catalogo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-catalogo_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - catalogo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-catalogo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - catalogo

  servicio-catalogo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-catalogo_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CATEDRA_API_URL: ${CATEDRA_API_URL:-}
      CATEDRA_JWT_TOKEN: ${CATEDRA_JWT_TOKEN:-}
      CATEDRA_GROUP_ID: ${CATEDRA_GROUP_ID:-}
      CATEDRA_PROVISIONING_STATUS: ${CATEDRA_PROVISIONING_STATUS:-}
      CATEDRA_REDIS_HOST: ${CATEDRA_REDIS_HOST:-}
      CATEDRA_REDIS_PORT: ${CATEDRA_REDIS_PORT:-6379}
      CATEDRA_REDIS_USERNAME: ${CATEDRA_REDIS_USERNAME:-}
      CATEDRA_REDIS_PASSWORD: ${CATEDRA_REDIS_PASSWORD:-}
      CATEDRA_REDIS_READ_NAMESPACE: ${CATEDRA_REDIS_READ_NAMESPACE:-catedra:sync:*}
      CATEDRA_REDIS_WRITE_NAMESPACE: ${CATEDRA_REDIS_WRITE_NAMESPACE:-}
      CATEDRA_KAFKA_BOOTSTRAP_SERVERS: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:-}
      CATEDRA_KAFKA_CONSUMER_GROUP_ID: ${CATEDRA_KAFKA_CONSUMER_GROUP_ID:-}
      CATEDRA_KAFKA_CATALOG_TOPIC: ${CATEDRA_KAFKA_CATALOG_TOPIC:-}
      CATEDRA_KAFKA_ENABLED: ${CATEDRA_KAFKA_ENABLED:-true}
      CATEDRA_RECONCILIATION_ENABLED: ${CATEDRA_RECONCILIATION_ENABLED:-true}
      CATEDRA_RECONCILIATION_INTERVAL_MS: ${CATEDRA_RECONCILIATION_INTERVAL_MS:-60000}
      CATEDRA_RECONCILIATION_INITIAL_DELAY_MS: ${CATEDRA_RECONCILIATION_INITIAL_DELAY_MS:-30000}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET es obligatorio}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-servicio-turnos}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    ports:
      - ${CATALOGO_PORT:-8081}:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - catalogo

volumes:
  catalogo_db_data:

networks:
  catalogo:
